[package]
name = "rhn-printing-plugin"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Data_Pdf",
  "Foundation",
  "Graphics_Imaging",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
  "Win32_System_WinRT",
] }
windows-future = "0.3"

[dev-dependencies]
webplus-plugin-config.workspace = true
